name: tma-dashboard

services:
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tma}
      POSTGRES_USER: ${POSTGRES_USER:-tma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tma}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tma}?sslmode=disable
      LISTEN_ADDR: :8080
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DEV_ALLOW_ALL_ORIGINS: ${DEV_ALLOW_ALL_ORIGINS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "${CONTROL_PLANE_HOST:-0.0.0.0}:${CONTROL_PLANE_PORT:-18080}:8080"
    networks: [backend]

  dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "${DASHBOARD_HOST:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    depends_on:
      control-plane:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
